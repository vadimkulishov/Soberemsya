<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Соберемся Админ</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-soft: #eef2f6;
      --text: #17202a;
      --muted: #657384;
      --line: #d9e0e8;
      --accent: #0a84ff;
      --accent-dark: #0069d9;
      --danger: #d92d20;
      --ok: #138a43;
      --shadow: 0 14px 34px rgba(19, 31, 45, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 0 26px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 15px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .login {
      max-width: 440px;
      margin: 56px auto 0;
      padding: 24px;
    }

    .login h2,
    .users h2 {
      margin: 0 0 18px;
      font-size: 20px;
      letter-spacing: 0;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 9px 11px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.14);
    }

    button {
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button.secondary {
      background: var(--surface-soft);
      color: var(--text);
    }

    button.secondary:hover {
      background: #e1e8f0;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.56;
    }

    .toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .toolbar .field {
      flex: 1;
      margin: 0;
    }

    .users {
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      border-top: 1px solid var(--line);
      padding: 12px 10px;
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .email {
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .role {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 92px;
      border-radius: 999px;
      background: var(--surface-soft);
      padding: 5px 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .role.admin {
      background: #e8f3ff;
      color: #0057b8;
    }

    .role.organizer {
      background: #e8f7ee;
      color: #096b35;
    }

    .message {
      min-height: 22px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .message.error {
      color: var(--danger);
    }

    .message.ok {
      color: var(--ok);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 760px) {
      header,
      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      table,
      thead,
      tbody,
      tr,
      th,
      td {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        border-top: 1px solid var(--line);
        padding: 12px 0;
      }

      td {
        border: 0;
        padding: 6px 0;
      }

      td::before {
        content: attr(data-label);
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 5px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Соберемся Админ</h1>
        <div class="subtitle">Пользователи и права доступа</div>
      </div>
      <button id="logoutButton" class="secondary hidden" type="button">Выйти</button>
    </header>

    <section id="loginPanel" class="panel login">
      <h2>Вход администратора</h2>
      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" placeholder="admin@example.com" required>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="loginButton" type="submit">Войти</button>
      </form>
      <div id="loginMessage" class="message"></div>
    </section>

    <section id="usersPanel" class="panel users hidden">
      <div class="toolbar">
        <div>
          <h2>Пользователи</h2>
          <div id="sessionInfo" class="subtitle"></div>
        </div>
        <div class="field">
          <label for="search">Поиск</label>
          <input id="search" type="search" placeholder="Имя или email">
        </div>
        <button id="refreshButton" class="secondary" type="button">Обновить</button>
      </div>

      <table>
        <thead>
          <tr>
            <th style="width: 70px;">ID</th>
            <th>Пользователь</th>
            <th style="width: 140px;">Текущая роль</th>
            <th style="width: 170px;">Новая роль</th>
            <th style="width: 130px;">Действие</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
      <div id="usersMessage" class="message"></div>
    </section>
  </main>

  <script>
    const state = {
      token: localStorage.getItem("adminToken") || "",
      user: JSON.parse(localStorage.getItem("adminUser") || "null"),
      users: [],
      searchTimer: null
    };

    const roles = [
      { value: "user", label: "Пользователь" },
      { value: "organizer", label: "Организатор" },
      { value: "admin", label: "Админ" }
    ];

    const loginPanel = document.querySelector("#loginPanel");
    const usersPanel = document.querySelector("#usersPanel");
    const logoutButton = document.querySelector("#logoutButton");
    const loginForm = document.querySelector("#loginForm");
    const loginButton = document.querySelector("#loginButton");
    const loginMessage = document.querySelector("#loginMessage");
    const usersMessage = document.querySelector("#usersMessage");
    const usersBody = document.querySelector("#usersBody");
    const searchInput = document.querySelector("#search");
    const refreshButton = document.querySelector("#refreshButton");
    const sessionInfo = document.querySelector("#sessionInfo");

    function setMessage(node, text, type = "") {
      node.textContent = text;
      node.className = `message ${type}`.trim();
    }

    function setAuthenticated(isAuthenticated) {
      loginPanel.classList.toggle("hidden", isAuthenticated);
      usersPanel.classList.toggle("hidden", !isAuthenticated);
      logoutButton.classList.toggle("hidden", !isAuthenticated);
      sessionInfo.textContent = state.user ? `${state.user.username} · ${state.user.email}` : "";
    }

    async function api(path, options = {}) {
      const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
      };

      if (state.token) {
        headers.Authorization = `Bearer ${state.token}`;
      }

      const response = await fetch(path, { ...options, headers });
      const text = await response.text();
      const data = text ? JSON.parse(text) : null;

      if (!response.ok) {
        throw new Error(data?.detail || "Запрос не выполнен");
      }

      return data;
    }

    async function login(event) {
      event.preventDefault();
      loginButton.disabled = true;
      setMessage(loginMessage, "Входим...");

      try {
        const payload = {
          email: document.querySelector("#email").value.trim(),
          password: document.querySelector("#password").value
        };
        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify(payload)
        });

        if (data.user.role !== "admin") {
          throw new Error("У этой учетной записи нет прав администратора");
        }

        state.token = data.access_token;
        state.user = data.user;
        localStorage.setItem("adminToken", state.token);
        localStorage.setItem("adminUser", JSON.stringify(state.user));
        setMessage(loginMessage, "");
        setAuthenticated(true);
        await loadUsers();
      } catch (error) {
        setMessage(loginMessage, error.message, "error");
      } finally {
        loginButton.disabled = false;
      }
    }

    function logout() {
      state.token = "";
      state.user = null;
      state.users = [];
      localStorage.removeItem("adminToken");
      localStorage.removeItem("adminUser");
      usersBody.innerHTML = "";
      setMessage(usersMessage, "");
      setAuthenticated(false);
    }

    async function loadUsers() {
      setMessage(usersMessage, "Загружаем пользователей...");
      refreshButton.disabled = true;

      try {
        const query = searchInput.value.trim();
        const suffix = query ? `?search=${encodeURIComponent(query)}` : "";
        state.users = await api(`/api/registrations/admin/users${suffix}`);
        renderUsers();
        setMessage(usersMessage, state.users.length ? `Найдено: ${state.users.length}` : "Пользователи не найдены");
      } catch (error) {
        if (/Unauthorized|Only admins/i.test(error.message)) {
          logout();
        }
        setMessage(usersMessage, error.message, "error");
      } finally {
        refreshButton.disabled = false;
      }
    }

    function renderUsers() {
      usersBody.innerHTML = "";

      for (const user of state.users) {
        const row = document.createElement("tr");
        const roleOptions = roles.map((role) => {
          const selected = role.value === user.role ? "selected" : "";
          return `<option value="${role.value}" ${selected}>${role.label}</option>`;
        }).join("");

        row.innerHTML = `
          <td data-label="ID">${user.id}</td>
          <td data-label="Пользователь">
            <strong>${escapeHtml(user.username)}</strong>
            <div class="email">${escapeHtml(user.email)}</div>
          </td>
          <td data-label="Текущая роль"><span class="role ${user.role}">${escapeHtml(user.role)}</span></td>
          <td data-label="Новая роль">
            <select data-role-select="${user.id}" aria-label="Новая роль для ${escapeHtml(user.username)}">
              ${roleOptions}
            </select>
          </td>
          <td data-label="Действие">
            <button type="button" data-save-role="${user.id}">Сохранить</button>
          </td>
        `;
        usersBody.append(row);
      }
    }

    async function changeRole(userId, button) {
      const select = document.querySelector(`[data-role-select="${userId}"]`);
      const newRole = select.value;
      button.disabled = true;
      setMessage(usersMessage, "Сохраняем роль...");

      try {
        await api("/api/registrations/admin/change-role", {
          method: "POST",
          body: JSON.stringify({ user_id: Number(userId), new_role: newRole })
        });
        await loadUsers();
        setMessage(usersMessage, "Роль обновлена", "ok");
      } catch (error) {
        setMessage(usersMessage, error.message, "error");
      } finally {
        button.disabled = false;
      }
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      })[char]);
    }

    loginForm.addEventListener("submit", login);
    logoutButton.addEventListener("click", logout);
    refreshButton.addEventListener("click", loadUsers);
    searchInput.addEventListener("input", () => {
      window.clearTimeout(state.searchTimer);
      state.searchTimer = window.setTimeout(loadUsers, 250);
    });
    usersBody.addEventListener("click", (event) => {
      const button = event.target.closest("[data-save-role]");
      if (button) {
        changeRole(button.dataset.saveRole, button);
      }
    });

    setAuthenticated(Boolean(state.token));
    if (state.token) {
      loadUsers();
    }
  </script>
</body>
</html>
