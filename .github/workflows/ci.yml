name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
        xcodebuild -version

    - name: Install iOS Simulator
      run: |
        xcodebuild -downloadPlatform iOS
        xcrun simctl list runtimes | grep iOS

    - name: Create simulator
      run: |
        RUNTIME=$(xcrun simctl list runtimes | grep 'com.apple.CoreSimulator.SimRuntime.iOS' | tail -1 | sed -E 's/.*\(([^)]+)\).*/\1/')
        echo "Using runtime: $RUNTIME"
        xcrun simctl create "CI_iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME" || true
        xcrun simctl list devices available | grep CI_iPhone

    - name: Build
      run: |
        xcodebuild build-for-testing \
          -project Soberemsya.xcodeproj \
          -scheme Soberemsya \
          -destination 'platform=iOS Simulator,name=CI_iPhone' \
          -skipPackagePluginValidation \
          IPHONEOS_DEPLOYMENT_TARGET=18.0 \
          WATCHOS_DEPLOYMENT_TARGET=11.0 \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          | xcpretty && exit ${PIPESTATUS[0]}

    - name: Test
      run: |
        xcodebuild test-without-building \
          -project Soberemsya.xcodeproj \
          -scheme Soberemsya \
          -destination 'platform=iOS Simulator,name=CI_iPhone' \
          -only-testing:SoberemsyaTests \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty && exit ${PIPESTATUS[0]}
