name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Install xcpretty
      run: gem install xcpretty

    - name: Install iOS Simulator
      run: |
        xcodebuild -downloadPlatform iOS
        xcrun simctl list runtimes | grep iOS

    - name: Create simulator
      run: |
        RUNTIME=$(xcrun simctl list runtimes available | grep 'com.apple.CoreSimulator.SimRuntime.iOS' | tail -1 | awk -F ' - ' '{print $NF}')
        if [ -z "$RUNTIME" ]; then
          echo "No available iOS simulator runtime found"
          xcrun simctl list runtimes
          exit 1
        fi
        echo "Using runtime id: $RUNTIME"
        SIMULATOR_NAME="CI_iPhone_${GITHUB_RUN_ID}"
        SIMULATOR_ID=$(xcrun simctl create "$SIMULATOR_NAME" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME")
        xcrun simctl boot "$SIMULATOR_ID" || true
        xcrun simctl bootstatus "$SIMULATOR_ID" -b
        echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
        xcrun simctl list devices available | grep "$SIMULATOR_NAME"

    - name: Build
      run: |
        xcodebuild build-for-testing \
          -project Soberemsya.xcodeproj \
          -scheme Soberemsya \
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
          -skipPackagePluginValidation \
          IPHONEOS_DEPLOYMENT_TARGET=18.0 \
          WATCHOS_DEPLOYMENT_TARGET=11.0 \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          | xcpretty && exit ${PIPESTATUS[0]}

    - name: Test
      run: |
        xcodebuild test-without-building \
          -project Soberemsya.xcodeproj \
          -scheme Soberemsya \
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
          -only-testing:SoberemsyaTests \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty && exit ${PIPESTATUS[0]}
